[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openscore"
version = "1.0.1"
description = "Open-source external security rating and attack-surface review with evidence and remediation (authorized use)"
requires-python = ">=3.11"
dependencies = ["dnspython>=2.4", "requests>=2.31", "cryptography>=41", "jinja2>=3.1",
                "markupsafe", "urllib3", "certifi"]   # last three are imported directly

[project.optional-dependencies]
screenshots = ["playwright>=1.40"]

[project.scripts]
openscore = "openscore.cli:main"

[tool.setuptools.packages.find]
include = ["openscore*"]
