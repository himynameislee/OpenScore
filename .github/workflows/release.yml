name: Release

# Push a tag like v1.0.0 to build standalone binaries and a sample report, then create a DRAFT
# GitHub Release with everything attached. Review the notes and click Publish by hand.
# Immutable releases are on: assets can't be added after publishing, so they must be on the
# draft first. Push the tag from git (a release published from the web UI would have no assets).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: openscore-windows-x64.exe
            built: dist/openscore.exe
          - os: ubuntu-latest
            artifact: openscore-linux-x64
            built: dist/openscore
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      # Playwright is left out of the single-file binary (it needs a downloaded browser);
      # screenshots are available when running from source.
      - run: pyinstaller --onefile --name openscore --exclude-module playwright openscore_entry.py
      - run: ${{ matrix.built }} --version
      - run: ${{ matrix.built }} -h > /dev/null
      # Smoke test the frozen binary on the lab target (light mode, no network beyond localhost):
      # catches modules or data files PyInstaller left out, which --version alone wouldn't.
      - name: Lab scan with the built binary
        run: |
          python tests/fake_target.py > fake_target.log 2>&1 &
          python - <<'PY'
          import socket, sys, time
          for _ in range(60):
              try:
                  socket.create_connection(("127.0.0.1", 8443), timeout=1).close(); break
              except OSError:
                  time.sleep(0.5)
          else:
              sys.exit("lab target did not start")
          PY
          ${{ matrix.built }} lab.invalid --no-discovery --url https://127.0.0.1:8443/ http://127.0.0.1:8080/ \
            --no-screenshots --no-baseline -o smoke-reports
          python - <<'PY'
          import glob, json, sys
          r = json.load(open(glob.glob("smoke-reports/*.json")[0], encoding="utf-8"))
          assert glob.glob("smoke-reports/*.html"), "no HTML report"
          ids = {f["check_id"] for f in r["findings"]}
          assert "http_hsts_missing" in ids, sorted(ids)
          print("binary smoke test OK:", r["overall"]["grade"], len(r["findings"]), "findings")
          PY
      - run: mv ${{ matrix.built }} ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
      # Sample report: an authorized active scan of the lab target with the built binary.
      - name: Sample report (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nmap testssl.sh
          python - <<'PY'
          import socket, subprocess, sys, time
          def up():
              try:
                  socket.create_connection(("127.0.0.1", 8443), timeout=1).close(); return True
              except OSError:
                  return False
          if not up():   # normally still running from the smoke test
              subprocess.Popen([sys.executable, "tests/fake_target.py"], stdout=subprocess.DEVNULL,
                               stderr=subprocess.DEVNULL, start_new_session=True)
              for _ in range(60):
                  if up(): break
                  time.sleep(0.5)
              else:
                  sys.exit("lab target did not start")
          PY
          ./${{ matrix.artifact }} lab.invalid --client "Acme Lab (deliberately misconfigured test server)" \
            --no-discovery --url https://127.0.0.1:8443/ http://127.0.0.1:8080/ --ips 127.0.0.1/32 \
            --active --authorization "Local lab test" -y --delay 0 --timeout 5 --no-nuclei \
            --no-screenshots --no-baseline -o sample
          cp sample/*.html openscore-sample-report.html
          python - <<'PY'
          import glob, json
          r = json.load(open(glob.glob("sample/*.json")[0], encoding="utf-8"))
          ids = {f["check_id"] for f in r["findings"]}
          for want in ("exp_git", "exp_env", "http_hsts_missing"):
              assert want in ids, (want, sorted(ids))
          dump = json.dumps(r)
          for secret in ("hunter2", "base64:abc"):
              assert secret not in dump, f"secret {secret!r} leaked into the sample report"
          print("sample report OK:", r["overall"]["grade"], len(r["findings"]), "findings")
          PY
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: openscore-sample-report.html
          path: openscore-sample-report.html
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Create draft release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          args=(--draft --verify-tag --generate-notes --title "OpenScore ${TAG#v}")
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi   # v1.0.0-rc1 etc. are pre-releases
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run: a draft for this tag already exists. Published releases are immutable and refuse this.
            gh release upload "$TAG" * --clobber
          else
            gh release create "$TAG" "${args[@]}" *
          fi
          echo "Draft release ready: review the notes, then Publish on GitHub."
